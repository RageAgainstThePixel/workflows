extensions:
  - addsTo:
      pack: codeql/actions-all
      extensible: trustedActionsOwnerDataModel
    data:
      - ["RageAgainstThePixel"]
      - ["rageagainstthepixel"]
      - ["buildalon"]
      - ["Buildalon"]
