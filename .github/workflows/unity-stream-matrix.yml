name: unity-stream-matrix
# Builds the Unity job matrix for a caller. Pull requests and pushes test the streams the official Unity CLI lists
# (the LTS lines, the current release, the beta and the alpha), so a stream joins when Unity lists it and leaves when
# Unity stops. Scheduled runs, or callers passing legacy: true, test the older major.minor lines in legacy-build-options,
# and those runs need allow-security-alert, since Unity labels most of those editors with a Security Alert. A stream
# that only has alpha releases gets " (alpha)" on its group name and "alpha": true on its rows, so a caller's row job
# can set continue-on-error: ${{ matrix.alpha == true }} and unity-row-checks reports those rows without gating.
on:
  workflow_call:
    inputs:
      build-options:
        description: Path to the build options json with the platform rows and the fallback unity-version list
        type: string
        default: ./.github/workflows/build-options.json
      legacy-build-options:
        description: Path to the build options json with the older unity-version lines the monthly run tests
        type: string
        default: ./.github/workflows/build-options-legacy.json
      legacy:
        description: Test the legacy build options instead of the current streams (scheduled runs always do)
        type: boolean
        default: false
      group-by:
        description: The job-builder group-by key
        type: string
        default: unity-version
      job-name-prefix:
        description: The job-builder job name prefix
        type: string
        default: ''
    outputs:
      jobs:
        description: The job-builder matrix
        value: ${{ jobs.setup.outputs.jobs }}
      allow-security-alert:
        description: Whether the rows must install editors that carry a Unity Security Alert
        value: ${{ jobs.setup.outputs.legacy }}
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      LEGACY: ${{ github.event_name == 'schedule' || inputs.legacy }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/
      - uses: actions/setup-node@v7
        if: ${{ env.LEGACY != 'true' }}
        with:
          node-version: 24.x
      - name: Unity streams
        id: streams
        if: ${{ env.LEGACY != 'true' }}
        shell: bash
        env:
          OPTIONS: ${{ inputs.build-options }}
          UNITY_NON_INTERACTIVE: '1'
          UNITY_NO_BANNER: '1'
          UNITY_NO_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          generated="${RUNNER_TEMP}/build-options.json"
          prefix="${RUNNER_TEMP}/unity-cli"
          # errexit does not apply inside a function called as a condition, so every step returns on failure itself
          list_versions() {
            npm install --prefix "${prefix}" --no-save --no-audit --no-fund '@rage-against-the-pixel/unity-cli@4' > /dev/null || return 1
            # unity-cli installs the official CLI with SHA-256 verification; no license is needed to list releases
            local cli
            cli="$(node -e "require(process.argv[1]).UnityCli.Get().then(c => console.log(c.executable), e => { console.error(e); process.exit(1); })" "${prefix}/node_modules/@rage-against-the-pixel/unity-cli" | tail -n 1)" || return 1
            [ -n "${cli}" ] || return 1
            "${cli}" editors --releases --format json |
              jq -c '[.data.items[].version | select(test("^[0-9]+\\.[0-9]+\\."))]'
          }
          alpha='[]'
          if versions="$(list_versions)" && [ "$(jq 'length' <<< "${versions}")" -gt 0 ]; then
            streams="$(jq -c 'map(capture("^(?<s>[0-9]+\\.[0-9]+)").s) | unique_by(split(".") | map(tonumber))' <<< "${versions}")"
            # a stream is alpha while every release Unity lists for it is an alpha; its first beta makes it gate again
            alpha="$(jq -c 'group_by(capture("^(?<s>[0-9]+\\.[0-9]+)").s) | map(select(all(.[]; test("a[0-9]+$"))) | .[0] | capture("^(?<s>[0-9]+\\.[0-9]+)").s)' <<< "${versions}")"
            jq --argjson streams "${streams}" '."unity-version" = $streams' "${OPTIONS}" > "${generated}"
          else
            # a failed listing falls back to the file's own list rather than failing the step
            echo "::warning::Could not list Unity releases, testing the fallback streams"
            cp "${OPTIONS}" "${generated}"
          fi
          echo "Alpha streams (report without gating): $(jq -r 'join(", ")' <<< "${alpha}")"
          echo "alpha=${alpha}" >> "${GITHUB_OUTPUT}"
          echo "Testing Unity streams: $(jq -r '."unity-version" | join(", ")' "${generated}")"
          echo "path=${generated}" >> "${GITHUB_OUTPUT}"
      - uses: RageAgainstThePixel/job-builder@v1
        id: setup-jobs
        with:
          build-options: ${{ env.LEGACY == 'true' && inputs.legacy-build-options || steps.streams.outputs.path }}
          group-by: ${{ inputs.group-by }}
          job-name-prefix: ${{ inputs.job-name-prefix }}
      - name: Flag alpha rows
        id: flag-alpha
        shell: bash
        env:
          JOBS: ${{ steps.setup-jobs.outputs.jobs }}
          ALPHA: ${{ steps.streams.outputs.alpha || '[]' }}
        run: |
          set -euo pipefail
          if [ -z "${JOBS}" ]; then
            echo "jobs=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # rows of an alpha-only stream may fail without failing the run; the group name tells them apart in checks
          jobs="$(jq -c --argjson alpha "${ALPHA}" '
            .jobs |= map(
              .matrix.include |= map(if (."unity-version" as $v | $alpha | index($v)) != null then .alpha = true else . end)
              | if any(.matrix.include[]; .alpha == true) then .name += " (alpha)" else . end)' <<< "${JOBS}")"
          echo "jobs=${jobs}" >> "${GITHUB_OUTPUT}"
    outputs:
      jobs: ${{ steps.flag-alpha.outputs.jobs }}
      legacy: ${{ env.LEGACY }}
