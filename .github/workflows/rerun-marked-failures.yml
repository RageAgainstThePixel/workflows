name: rerun-marked-failures
# Reruns the failed jobs of a finished run when every failure was marked as retryable, such as no free Unity license
# seat or a transient download error. unity-cli marks those failures with an error annotation whose title is one of the
# markers below, so any repository whose jobs use unity-cli can call this from a workflow_run workflow of its own:
#
#   on:
#     workflow_run:
#       workflows: [<workflow name>]
#       types: [completed]
#   jobs:
#     rerun:
#       if: github.event.workflow_run.conclusion == 'failure'
#       permissions:
#         actions: write
#         checks: read
#       uses: RageAgainstThePixel/workflows/.github/workflows/rerun-marked-failures.yml@v1
#       with:
#         run-id: ${{ github.event.workflow_run.id }}
#         run-attempt: ${{ github.event.workflow_run.run_attempt }}
#
# The run starts only once the watched run has finished, which is when its Windows seats are returned, so nothing waits
# or polls in between.
on:
  workflow_call:
    inputs:
      run-id:
        description: The finished run to check.
        required: true
        type: number
      run-attempt:
        description: The attempt of that run that finished.
        required: true
        type: number
      max-attempts:
        description: The last attempt that may be rerun; later attempts are left failed.
        required: false
        type: number
        default: 3
      markers:
        description: Comma-separated annotation titles that mark a failure as retryable.
        required: false
        type: string
        default: unity-license-exhausted,unity-transient-failure
      ignore-jobs:
        description: Comma-separated names of jobs that only report other jobs' results, such as an aggregate check.
        required: false
        type: string
        default: ci-result
      delay-seconds:
        description: Seconds to wait before the rerun, for seats that other repositories may still hold.
        required: false
        type: number
        default: 0
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # to rerun the failed jobs
      checks: read # to read the failed jobs' annotations
    steps:
      - name: Rerun marked failures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          RUN_ATTEMPT: ${{ inputs.run-attempt }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          MARKERS: ${{ inputs.markers }}
          IGNORE_JOBS: ${{ inputs.ignore-jobs }}
          DELAY_SECONDS: ${{ inputs.delay-seconds }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          attempt="$RUN_ATTEMPT"
          to_json_list() { jq -cn --arg s "$1" '$s | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'; }
          markers="$(to_json_list "$MARKERS")"
          ignore="$(to_json_list "$IGNORE_JOBS")"
          summary() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          # the REST API answers 5xx now and then, and always for 100 jobs with their steps in one page, so pages are
          # kept small and a retry with backoff rides out the rest
          gh_api() {
            local out try
            for try in 1 2 3 4; do
              if out="$(gh api "$1" --paginate --jq "$2")"; then
                printf '%s' "$out"
                return 0
              fi
              if [ "$try" -lt 4 ]; then sleep $((2 ** try)); fi
            done
            echo "gh api $1 failed after 4 attempts" >&2
            return 1
          }

          jobs="$(gh_api "repos/$repo/actions/runs/$RUN_ID/attempts/$attempt/jobs?per_page=30" \
            '.jobs[] | {id, name, conclusion, steps: (.steps // [] | length), failedSteps: ([.steps // [] | .[] | select(.conclusion == "failure")] | length)} | tojson')"
          failed="$(printf '%s\n' "$jobs" | jq -c --argjson ignore "$ignore" 'select(.conclusion == "failure" and (.name | IN($ignore[]) | not))')"
          if [ -z "$failed" ]; then
            summary "No failed jobs in run $RUN_ID attempt $attempt."
            exit 0
          fi

          marked=()
          unmarked=()
          while IFS= read -r job; do
            id="$(jq -r '.id' <<< "$job")"
            name="$(jq -r '.name' <<< "$job")"
            # a job's id is also its check run id
            titles="$(gh_api "repos/$repo/check-runs/$id/annotations?per_page=100" '.[].title')"
            hit="$(printf '%s\n' "$titles" | jq -nRr --argjson markers "$markers" 'first(inputs | select(IN($markers[]))) // empty')"
            if [ -n "$hit" ]; then
              marked+=("\`$hit\`: $name")
            # a job that only failed because a job it needs failed carries no annotation of its own
            elif [ "$(jq -r '.steps == 0 or .failedSteps == 0' <<< "$job")" = true ]; then
              continue
            else
              unmarked+=("$name")
            fi
          done <<< "$failed"

          summary "### Retryable failures in run $RUN_ID attempt $attempt"
          summary ''
          for m in "${marked[@]}"; do summary "- $m"; done
          for u in "${unmarked[@]}"; do summary "- not retryable: $u"; done
          summary ''

          if [ "${#marked[@]}" -eq 0 ]; then
            summary 'Nothing to rerun: no failure carries a retry marker.'
            exit 0
          fi
          if [ "${#unmarked[@]}" -gt 0 ]; then
            # a rerun repeats every failed job, so a real failure would only fail again at full cost
            summary 'Not rerun: other jobs failed for reasons a rerun does not fix.'
            exit 0
          fi
          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            summary "Not rerun: attempt $attempt reached the limit of $MAX_ATTEMPTS."
            echo "::warning::Run $RUN_ID still has retryable failures after $attempt attempts"
            exit 0
          fi

          if [ "$DELAY_SECONDS" -gt 0 ]; then sleep "$DELAY_SECONDS"; fi
          gh run rerun "$RUN_ID" --failed --repo "$repo"
          summary "Reran the ${#marked[@]} failed jobs as attempt $((attempt + 1))."
